<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Microfone" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .bg {
      fill: #e53935;
      animation: piscar 1s steps(1, end) infinite;
    }
    .linha {
      stroke: #e53935;
      animation: piscar-linha 1s steps(1, end) infinite;
    }
    @keyframes piscar {
      0%   { fill: #e53935; }
      50%  { fill: #1e88e5; }
    }
    @keyframes piscar-linha {
      0%   { stroke: #e53935; }
      50%  { stroke: #1e88e5; }
    }
  </style>

  <!-- Fundo (pisca entre vermelho e azul) -->
  <rect class="bg" x="0" y="0" width="100" height="100" rx="18"/>

  <!-- Corpo do microfone -->
  <rect x="37" y="16" width="26" height="42" rx="13" fill="#fff"/>

  <!-- Detalhes (grade) do microfone -->
  <line class="linha" x1="37" y1="30" x2="63" y2="30" stroke-width="2.5"/>
  <line class="linha" x1="37" y1="38" x2="63" y2="38" stroke-width="2.5"/>
  <line class="linha" x1="37" y1="46" x2="63" y2="46" stroke-width="2.5"/>

  <!-- Suporte em U -->
  <path d="M28 46 v4 a22 22 0 0 0 44 0 v-4" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Haste e base -->
  <line x1="50" y1="72" x2="50" y2="82" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  <line x1="38" y1="84" x2="62" y2="84" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
